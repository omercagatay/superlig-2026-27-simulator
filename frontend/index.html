<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="2026-27 Trendyol Süper Lig sezonu için Monte Carlo tahmini. Monte Carlo forecast for the 2026-27 Turkish Süper Lig season." />
    <title>Süper Lig 2026–27 Tahmini</title>
    <script>
      // Apply the saved (or OS-preferred) theme before first paint so dark
      // mode never flashes white. Mirrors initialTheme() and THEME_COLOR in
      // App.tsx.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark")
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = t;
          if (t === "dark")
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#16181c");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
