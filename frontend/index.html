<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2ecdf" />
    <meta name="description" content="2026-27 Trendyol Süper Lig sezonu için Monte Carlo tahmini — Monte Carlo forecast for the 2026-27 Turkish Süper Lig season" />
    <title>Süper Lig 2026–27 · Maç Programı</title>
    <script>
      // Apply the saved (or OS-preferred) edition before first paint, so a
      // night-edition reader never sees a flash of day paper. Mirrors
      // initialTheme() in App.tsx.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark")
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = t;
          if (t === "dark")
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#0f1724");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
