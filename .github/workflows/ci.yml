name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      # --all-targets builds examples without their #[cfg(test)] modules;
      # log_forecast's freeze rules are tested there.
      - name: Lint and run example tests
        run: |
          cargo clippy --examples --profile test -- -D warnings
          cargo test --examples

      - name: Build release
        run: cargo build --release

      # The committed backtest figures, which the docs quote, must still be
      # what the code produces. It reuses the release build above; the
      # example took 9 s to build and 5 s to run locally.
      - name: Backtest reproduces the committed metrics
        run: |
          EVAL_HOLDOUT=1 EVAL_METRICS=/tmp/metrics.json cargo run --release --example backtest
          python3 scripts/check_metrics.py diff /tmp/metrics.json data/metrics/backtest.json

      # The same for the season evaluation, whose figures the docs quote as
      # season: markers. About 6 s to run locally on 4 cores; the output does
      # not depend on the core count.
      - name: Season evaluation reproduces the committed metrics
        run: |
          EVAL_HOLDOUT=1 SEASON_METRICS=/tmp/season.json cargo run --release --example season_eval
          python3 scripts/check_metrics.py diff /tmp/season.json data/metrics/season.json

      # data/metrics/market.json, the offline market benchmark's
      # (examples/market.rs), is not rerun here: it needs bookmaker odds, which
      # are never committed and come over the network (scripts/fetch_odds.py).
      # It is regenerated by hand; the scripts job's docs check still holds
      # every figure the docs quote from it to the committed file.

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@1.87.0

      - name: Check all targets on the MSRV
        run: cargo check --locked --all-targets

  rust-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Script tests (offline)
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

      - name: Docs quote the committed metrics
        run: python3 scripts/check_metrics.py docs
